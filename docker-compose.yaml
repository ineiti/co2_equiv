services:
  llm:
    # ghcr.io/ggml-org/llama.cpp:server, pinned by digest for reproducible builds.
    image: ghcr.io/ggml-org/llama.cpp@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984
    command: ['-m', '/models/model.gguf', '--host', '0.0.0.0', '--port', '8080']
    volumes:
      - ./data/llm:/models
    expose:
      - '8080'

  backend:
    image: ghcr.io/ineiti/co2-equiv-backend:latest
    environment:
      - LLM_URL=http://llm:8080/v1/chat/completions
      - HISTORY_PATH=/data/fastapi/history.json
    volumes:
      - ./data/fastapi:/data/fastapi
    depends_on:
      - llm
    expose:
      - '8000'
    labels:
      - com.centurylinklabs.watchtower.enable=true

  frontend:
    image: ghcr.io/ineiti/co2-equiv-frontend:latest
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    depends_on:
      - backend
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # Maintained fork of watchtower (original project archived 2025-12-17).
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
